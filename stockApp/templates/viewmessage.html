{% extends 'main.html' %} 
{% load static %}

{% block content %}
<div class="main-content">
    <div class="stocks">
        <h3>Message Details</h3>
        <p><strong>Date:</strong> {{ message.date }}</p>
        <p><strong>Email Address:</strong> {{ message.email }}</p>
        <p><strong>Message:</strong> {{ message.subject }}</p>
        <form action="{% url 'deletemessage' message.id %}" method="post" style="display:inline;">
            {% csrf_token %}
            <button type="submit" onclick="return confirm('Are you sure you want to delete this message?');">Delete</button>
        </form>
        <a href="{% url 'messagespanel' %}">Back to Messages</a>
    </div>
</div>
{% endblock %}
